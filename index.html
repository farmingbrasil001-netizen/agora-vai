<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:'Inter',sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.screen{position:fixed;inset:0}

/* ---------- Ligar ---------- */
#powerOverlay{z-index:30;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#powerBtn{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px}
.ring{width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;animation:pulse 2.4s infinite cubic-bezier(.66,0,0,1)}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,255,255,.25)}to{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
#powerBtn small{display:block;font-size:11px;color:rgba(255,255,255,.45);margin-top:6px}
#powerBtn span{font-size:13px;letter-spacing:.25em;text-transform:uppercase}

/* ---------- Boot ---------- */
#bootScreen{z-index:20;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .9s,transform .9s}
#bootScreen.out{opacity:0;transform:scale(1.06);pointer-events:none}
.boot-logo{margin:0;font-family:'Montserrat','Arial Black',sans-serif;font-weight:900;font-size:clamp(6.5rem,23vw,17rem);line-height:.9;letter-spacing:-.04em;display:flex}
.letter{opacity:0;transform:scale(.96);filter:blur(4px)}
.go .letter-p{animation:fade 1.2s cubic-bezier(.22,1,.36,1) 0s forwards}
.go .letter-c{animation:fade 1.2s cubic-bezier(.22,1,.36,1) 1s forwards}
@keyframes fade{to{opacity:1;transform:scale(1);filter:blur(0)}}
.go .logo{animation:glow 4s ease-in-out 2.2s infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 12px rgba(255,255,255,.12))}to{filter:drop-shadow(0 0 32px rgba(255,255,255,.35))}}
#bootStatus{position:fixed;bottom:48px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transition:opacity .8s}
#bootStatus.on{opacity:1}
#bootStatus p{margin:0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:300;color:rgba(255,255,255,.7)}
.bar{width:170px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#bar{height:100%;width:0;background:rgba(255,255,255,.85)}

/* ---------- Menu ---------- */
#dash{z-index:10;background:radial-gradient(ellipse at 70% 25%,#0c1f3d 0%,#060d1a 48%,#020408 100%);display:flex;flex-direction:column;opacity:0;transform:scale(.98);pointer-events:none;transition:opacity 1s,transform 1s}
#dash.on{opacity:1;transform:none;pointer-events:auto}
#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent,rgba(0,0,0,.35));pointer-events:none}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:28px clamp(20px,5vw,56px) 0}
.tab{font-size:clamp(20px,2.4vw,26px);font-weight:600;letter-spacing:-.01em}
.top-right{display:flex;align-items:center;gap:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);transition:background .2s,transform .15s}
.icon-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:22px;height:22px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#818cf8);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative}
.avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#34d399;border:2px solid #060d1a}
#clock{font-size:18px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.9);min-width:3.4em;text-align:right}

main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:24px clamp(20px,5vw,56px) clamp(28px,6vh,56px)}
.row{display:flex;align-items:center;gap:20px}
.game-tile{width:clamp(110px,14vw,150px);aspect-ratio:1;border-radius:20px;background:radial-gradient(circle at 50% 35%,#2563eb,#1d4ed8 45%,#0f172a);border:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 16px 36px rgba(0,0,0,.6),0 0 28px rgba(120,180,255,.25);transform:scale(1.06);transition:transform .25s}
.game-tile:hover{transform:scale(1.1)}
.game-tile b{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(48px,7vw,72px);line-height:.85;letter-spacing:-.04em;text-shadow:0 4px 12px rgba(0,0,0,.45)}
.game-tile span{font-size:clamp(12px,1.4vw,15px);margin-top:4px}
.row h3{margin:0;font-size:20px;font-weight:400}
.hero h2{margin:0 0 6px;font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(40px,6vw,68px);letter-spacing:-.02em}
.hero p{margin:0 0 22px;font-weight:300;color:rgba(255,255,255,.8);font-size:clamp(15px,1.6vw,18px)}
#playBtn{background:#fff;color:#000;font-weight:600;padding:15px 56px;border-radius:999px;box-shadow:0 0 25px rgba(255,255,255,.28);transition:transform .2s}
#playBtn:hover{transform:scale(1.04)}
#playBtn:active{transform:scale(.97)}

/* ---------- Configurações ---------- */
#settings{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
#settings.on{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:400px;background:#101826;border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:22px 22px 14px;transform:translateY(12px);transition:transform .25s}
#settings.on .panel{transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel-head h4{margin:0;font-size:19px;font-weight:600}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-top:1px solid rgba(255,255,255,.08);font-size:15px}
.opt small{display:block;color:rgba(255,255,255,.5);font-size:12px;margin-top:2px}
.switch{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:#3b82f6}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
input[type=range]{width:140px;accent-color:#3b82f6}
.btn-soft{padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px}
.btn-soft:hover{background:rgba(255,255,255,.2)}

/* ---------- Jogo ---------- */
#game-screen{position:fixed;inset:0;z-index:50;background:#020617;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(1.03);pointer-events:none;transition:opacity .45s,transform .45s}
#game-screen.on{opacity:1;transform:none;pointer-events:auto}
#gameFrame{width:100%;height:100%;border:0;display:block;background:#000}
#exitGameBtn{position:fixed;top:20px;right:20px;z-index:60;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);font-size:13px;backdrop-filter:blur(8px)}
#exitGameBtn:hover{background:rgba(255,255,255,.18)}

#toast{position:fixed;top:84px;right:clamp(20px,4vw,48px);z-index:46;max-width:320px;background:rgba(20,28,43,.96);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 16px;font-size:14px;transform:translateX(130%);opacity:0;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s;pointer-events:none}
#toast.on{transform:none;opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<!-- Ligar -->
<div id="powerOverlay" class="screen">
  <button id="powerBtn" aria-label="Ligar console">
    <div class="ring"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></div>
    <div><span>Ligar console</span><small>Clique para iniciar com áudio</small></div>
  </button>
</div>

<!-- Boot -->
<div id="bootScreen" class="screen">
  <div class="logo"><h1 class="boot-logo" aria-label="PC"><span class="letter letter-p">P</span><span class="letter letter-c">C</span></h1></div>
  <div id="bootStatus"><p id="statusText">Iniciando sistema...</p><div class="bar"><div id="bar"></div></div></div>
</div>

<!-- Menu -->
<div id="dash" class="screen">
  <canvas id="particles"></canvas>
  <div class="shade"></div>
  <header>
    <div class="tab">Games</div>
    <div class="top-right">
      <button id="settingsBtn" class="icon-btn" title="Configurações" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="avatar" title="Jogador 1 (online)">PC</div>
      <div id="clock">--:--</div>
    </div>
  </header>

  <main>
    <div class="row">
      <button id="gameTile" class="game-tile" aria-label="Trabalho"><b>T</b><span>rabalho</span></button>
      <h3>Trabalho</h3>
    </div>
    <div class="hero">
      <h2>Trabalho</h2>
      <p>Pronto para jogar</p>
      <button id="playBtn">Jogar</button>
    </div>
  </main>
</div>

<!-- Configurações -->
<div id="settings" role="dialog" aria-modal="true" aria-label="Configurações">
  <div class="panel">
    <div class="panel-head">
      <h4>Configurações</h4>
      <button id="closeSettings" class="icon-btn" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </div>
    <div class="opt"><div>Som<small>Ligar ou desligar todos os sons</small></div><button id="optSound" class="switch" role="switch" aria-checked="true" aria-label="Som"></button></div>
    <div class="opt"><div>Volume</div><input id="optVolume" type="range" min="0" max="100" value="75" aria-label="Volume"></div>
    <div class="opt"><div>Relógio de 24 horas<small>Desligado mostra AM/PM</small></div><button id="opt24" class="switch" role="switch" aria-checked="true" aria-label="Relógio de 24 horas"></button></div>
    <div class="opt"><div>Tela cheia</div><button id="optFull" class="switch" role="switch" aria-checked="false" aria-label="Tela cheia"></button></div>
    <div class="opt"><div>Abertura<small>Rever a animação de boot</small></div><button id="optRestart" class="btn-soft">Reiniciar</button></div>
  </div>
</div>

<!-- Jogo -->
<div id="game-screen">
  <button id="exitGameBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sair (ESC)</button>

  <!-- Carrega o arquivo jogoabc.html aqui dentro -->
  <iframe id="gameFrame" title="Jogo ABC"></iframe>
</div>

<div id="toast"></div>

const SONS = {
  boot:  '',          // abertura continua com o som sintetizado
  click: SOM_UI,
  nav:   SOM_UI,
  open:  SOM_UI,
  back:  SOM_UI
};

const $ = id => document.getElementById(id);
const state = { sound: true, volume: 0.75, h24: true };

// ---------- Áudio ----------
let ctx, unlocked = false;
const audioCache = {};
for (const [k, src] of Object.entries(SONS)) {
  if (src) { const a = new Audio(src); a.preload = 'auto'; audioCache[k] = a; }
}

function ensureAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  unlocked = true;
}

function playSound(name) {
  if (!state.sound || !unlocked) return;
  if (audioCache[name]) {
    const a = audioCache[name].cloneNode();
    a.volume = state.volume;
    a.play().catch(() => {});
    return;
  }
  ensureAudio();
  const now = ctx.currentTime, v = state.volume;
  if (name === 'boot') {
    const notes = [130.81, 196.00, 293.66, 329.63, 392.00, 493.88];
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.28 * v || 0.0001, now + 0.9);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 5.2);
    master.connect(ctx.destination);
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i < 2 ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(f * 0.994, now);
      o.frequency.exponentialRampToValueAtTime(f, now + 1.4);
      g.gain.value = (i < 2 ? 0.24 : 0.14) / (1 + i * 0.15);
      o.connect(g); g.connect(master);
      o.start(now + i * 0.06); o.stop(now + 5.3);
    });
  }
}

// ---------- Boot ----------
let bootTimers = [];
function runBoot() {
  bootTimers.forEach(clearTimeout); bootTimers = [];
  const boot = $('bootScreen'), status = $('bootStatus'), bar = $('bar'), txt = $('statusText'), dash = $('dash');
  boot.classList.remove('out', 'go'); status.classList.remove('on'); dash.classList.remove('on');
  bar.style.transition = 'none'; bar.style.width = '0%';
  void boot.offsetWidth;
  boot.classList.add('go');
  playSound('boot');

  bootTimers.push(setTimeout(() => {
    status.classList.add('on');
    bar.style.transition = 'width 2.6s cubic-bezier(.4,0,.2,1)';
    bar.style.width = '100%';
  }, 2200));
  bootTimers.push(setTimeout(() => txt.textContent = 'Carregando biblioteca...', 3400));
  bootTimers.push(setTimeout(() => {
    boot.classList.add('out');
    dash.classList.add('on');
  }, 5000));
}

$('powerBtn').addEventListener('click', () => {
  ensureAudio();
  playSound('click');
  const ov = $('powerOverlay');
  ov.style.opacity = '0'; ov.style.pointerEvents = 'none';
  setTimeout(() => ov.remove(), 700);
  runBoot();
});

// ---------- Relógio ----------
function updateClock() {
  const d = new Date();
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
  if (state.h24) {
    $('clock').textContent = `${String(h).padStart(2, '0')}:${m}`;
  } else {
    const suf = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    $('clock').textContent = `${h}:${m} ${suf}`;
  }
}
updateClock(); setInterval(updateClock, 1000);

// ---------- Partículas ----------
const canvas = $('particles'), c = canvas.getContext('2d');
let W, H, pts = [];
function resize() {
  W = canvas.width = innerWidth; H = canvas.height = innerHeight;
  pts = Array.from({ length: 55 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.8 + 0.5,
    vx: (Math.random() - 0.5) * 0.22, vy: -Math.random() * 0.3 - 0.08,
    a: Math.random() * 0.4 + 0.1
  }));
}
resize(); addEventListener('resize', resize);
(function loop() {
  c.clearRect(0, 0, W, H);
  for (const p of pts) {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
    if (p.x < -5) p.x = W + 5; if (p.x > W + 5) p.x = -5;
    c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    c.fillStyle = `rgba(170,210,255,${p.a})`; c.fill();
  }
  requestAnimationFrame(loop);
})();

// ---------- Navegação & Jogo ----------
const gameFrame = $('gameFrame');

function openGame() {
  playSound('open');
  gameFrame.src = 'jogoabc.html'; // Abre direto o arquivo jogoabc.html (mesma pasta do index.html)
  $('game-screen').classList.add('on');
  setTimeout(() => gameFrame.focus(), 100); // Joga o foco do teclado direto para o jogo
}

function closeGame() {
  if (!$('game-screen').classList.contains('on')) return;
  playSound('back');
  $('game-screen').classList.remove('on');
  setTimeout(() => { gameFrame.src = 'about:blank'; }, 450); // Fecha o jogo após a transição
}

$('playBtn').addEventListener('click', openGame);
$('gameTile').addEventListener('click', openGame);
$('exitGameBtn').addEventListener('click', closeGame);

// ---------- Configurações ----------
const settings = $('settings');
const openSettings = () => { playSound('open'); settings.classList.add('on'); };
const closeSettings = () => { playSound('back'); settings.classList.remove('on'); };
$('settingsBtn').addEventListener('click', openSettings);
$('closeSettings').addEventListener('click', closeSettings);
settings.addEventListener('click', e => { if (e.target === settings) closeSettings(); });

function bindSwitch(id, initial, onChange) {
  const el = $(id); el.setAttribute('aria-checked', initial);
  el.addEventListener('click', () => {
    const next = el.getAttribute('aria-checked') !== 'true';
    el.setAttribute('aria-checked', next);
    onChange(next);
    playSound('click');
  });
}
// Som desligado: toca o som uma última vez antes de silenciar; ligado: toca normalmente
bindSwitch('optSound', true, v => { if (v) { state.sound = true; } else { playSound('click'); state.sound = false; } });
bindSwitch('opt24', true, v => { state.h24 = v; updateClock(); });
bindSwitch('optFull', false, v => {
  if (v) document.documentElement.requestFullscreen?.().catch(() => {});
  else if (document.fullscreenElement) document.exitFullscreen?.();
});
document.addEventListener('fullscreenchange', () => $('optFull').setAttribute('aria-checked', !!document.fullscreenElement));
$('optVolume').addEventListener('input', e => state.volume = e.target.value / 100);
$('optVolume').addEventListener('change', () => playSound('click'));
$('optRestart').addEventListener('click', () => { closeSettings(); runBoot(); });

// ---------- Teclado ----------
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('game-screen').classList.contains('on')) closeGame();
    else if (settings.classList.contains('on')) closeSettings();
  }
  if (e.key === 'Enter' && $('dash').classList.contains('on') && !settings.classList.contains('on') && !$('game-screen').classList.contains('on')) {
    openGame();
  }
});

// ---------- Toast ----------
let toastTimer;
function showToast(msg) {
  playSound('click');
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 3500);
}
</script>
