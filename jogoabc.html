<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
        }

        #status {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #94a3b8;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 8px;
        }

        .cell {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .cell:hover {
            background-color: #334155;
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.x {
            color: #38bdf8;
        }

        .cell.o {
            color: #f43f5e;
        }

        #restartBtn {
            margin-top: 24px;
            padding: 10px 24px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #restartBtn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <h1>Jogo da Velha</h1>
    <div id="status">Vez do jogador: X</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button id="restartBtn">Reiniciar Jogo</button>

    <script>
        const board = document.getElementById('board');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');
        const cells = document.querySelectorAll('.cell');

        let options = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let isRunning = true;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
            [0, 4, 8], [2, 4, 6]            // Diagonais
        ];

        function initializeGame() {
            cells.forEach(cell => cell.addEventListener('click', cellClicked));
            restartBtn.addEventListener('click', restartGame);
            statusText.textContent = `Vez do jogador: ${currentPlayer}`;
        }

        initializeGame();

        function cellClicked() {
            const index = this.getAttribute('data-index');

            if (options[index] !== '' || !isRunning) return;

            updateCell(this, index);
            checkWinner();
        }

        function updateCell(cell, index) {
            options[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());
        }

        function changePlayer() {
            currentPlayer = (currentPlayer == 'X') ? 'O' : 'X';
            statusText.textContent = `Vez do jogador: ${currentPlayer}`;
        }

        function checkWinner() {
            let roundWon = false;

            for (let i = 0; i < winConditions.length; i++) {
                const condition = winConditions[i];
                const cellA = options[condition[0]];
                const cellB = options[condition[1]];
                const cellC = options[condition[2]];

                if (cellA == '' || cellB == '' || cellC == '') continue;

                if (cellA == cellB && cellB == cellC) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `Jogador ${currentPlayer} venceu! 🎉`;
                isRunning = false;
            } else if (!options.includes('')) {
                statusText.textContent = `Empate! 🤝`;
                isRunning = false;
            } else {
                changePlayer();
            }
        }

        function restartGame() {
            currentPlayer = 'X';
            options = ['', '', '', '', '', '', '', '', ''];
            statusText.textContent = `Vez do jogador: ${currentPlayer}`;
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o');
            });
            isRunning = true;
        }

        // Atalho para o ESC fechar o iframe caso esteja dentro do console principal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.parent.document.getElementById('exitGameBtn').click();
            }
        });
    </script>
</body>
</html>
